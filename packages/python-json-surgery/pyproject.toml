[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mightydatainc-json-surgery"
version = "1.2.0"
description = "An easy-to-call function that invokes iterative, AI-guided edits to a JSON-compatible object"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "mightydatainc-llm-conversation>=2.0.5"
]
authors = [{ name = "Mikhail Voloshin" }]
license = { file = "LICENSE" }

[tool.hatch.build.targets.wheel]
packages = ["src/mightydatainc_json_surgery"]

[tool.pytest.ini_options]
pythonpath = ["src"]
